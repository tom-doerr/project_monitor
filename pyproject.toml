[tool.poetry]
name = "project-watch"
version = "0.1.0"
description = "Real-time project monitoring with CLI and TUI interfaces"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
rich = "^13.0.0"
textual = "^0.34.0"
watchdog = "^3.0.0"
pytest = "*"
pylint = "*"

[tool.poetry.scripts]
project-watch = "project_watch.cli:main"
project-watch-tui = "project_watch.tui:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=project_watch --cov-report=term-missing"

[tool.coverage.run]
source = ["project_watch"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
